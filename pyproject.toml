[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "autofusion"
version = "0.6.0"
description = "Cross-model review, evidence grounding, and auditable fusion for serious engineering work"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Onour Impram" }]
keywords = ["claude-code", "codex", "multi-model", "code-review", "verification"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = ["jsonschema>=4.25,<5"]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "mypy>=1.17,<3",
  "pytest>=9,<10",
  "pytest-cov>=7,<8",
  "ruff>=0.12,<1",
  "types-jsonschema>=4.26",
]

[project.scripts]
autofusion = "autofusion.cli:main"

[project.urls]
Homepage = "https://github.com/OnourImpram/autofusion"
Repository = "https://github.com/OnourImpram/autofusion"
Issues = "https://github.com/OnourImpram/autofusion/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/autofusion"]

[tool.hatch.build.targets.sdist]
include = [
  ".claude-plugin/**",
  ".fusion.example.json",
  ".github/workflows/**",
  "CHANGELOG.md",
  "LICENSE",
  "README.md",
  "docs/**",
  "plugins/**",
  "pyproject.toml",
  "requirements-validation.txt",
  "schemas/**",
  "scripts/**",
  "src/**",
  "tests/**",
]

[tool.hatch.build]
include = [
  "src/autofusion/**/*.py",
  "src/autofusion/py.typed",
  "src/autofusion/default_config.json",
  "src/autofusion/schemas/*.json",
  "schemas/*.json",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
pretty = true
mypy_path = "src"

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["autofusion"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
