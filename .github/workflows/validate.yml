name: Validate repository

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-validation.txt

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check ".[dev]"

      - name: Lint Python
        run: ruff check src tests scripts

      - name: Type-check Python
        run: mypy --strict src scripts tests

      - name: Run tests with coverage
        run: pytest -q --cov=autofusion --cov-branch --cov-report=term-missing

      - name: Validate repository contracts
        run: python scripts/validate_repository.py

      - name: Validate receipt contract instances
        run: python scripts/validate_contract_instances.py

      - name: Validate analysis contract instances
        run: python scripts/validate_analysis_instances.py

      - name: Validate linked run provenance
        run: python scripts/validate_linked_run.py

      - name: Validate JSON Schema documents
        run: |
          python - <<'PY'
          import json
          import logging
          from pathlib import Path

          from jsonschema import Draft202012Validator

          logging.basicConfig(level=logging.INFO, format="%(levelname)s %(message)s")
          logger = logging.getLogger("autofusion.schemas")

          for path in sorted(Path("schemas").glob("*.schema.json")):
              schema = json.loads(path.read_text(encoding="utf-8"))
              Draft202012Validator.check_schema(schema)
              logger.info("%s: valid", path)
          PY

      - name: Validate packaged schema parity
        run: |
          python - <<'PY'
          import filecmp
          from pathlib import Path

          root = Path("schemas")
          packaged = Path("src/autofusion/schemas")
          missing = []
          different = []
          for schema in sorted(root.glob("*.schema.json")):
              candidate = packaged / schema.name
              if not candidate.exists():
                  missing.append(schema.name)
              elif not filecmp.cmp(schema, candidate, shallow=False):
                  different.append(schema.name)
          if missing or different:
              raise SystemExit(f"schema parity failed, missing={missing}, different={different}")
          PY

      - name: Build package
        run: python -m build
